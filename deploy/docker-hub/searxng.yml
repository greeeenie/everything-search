use_default_settings:
  engines:
    keep_only: [bing, duckduckgo, google, brave, yahoo]
engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: false
  - name: yahoo
    disabled: false
general:
  debug: false
  instance_name: Research discovery
search:
  formats: [html, json]
  default_lang: auto
  autocomplete: ""
server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  public_instance: false
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
  proxies:
    all://: socks5h://egress-xray:1080
