name: everything-search

services:
  research-api:
    build:
      context: ../..
      target: core
    networks:
      ingress:
        aliases: [research-api]
      egress: {}
      search-net: {}
    environment:
      RESEARCH_HTTP_HOST: 0.0.0.0
      RESEARCH_ALLOW_INTERNAL_HOSTS: "1"
      RESEARCH_PUBLIC_BASE_URL: ${RESEARCH_PUBLIC_BASE_URL:-https://search.example.com}
      RESEARCH_DATABASE: /data/research.sqlite3
      RESEARCH_CONFIG: /app/config/egress.yaml
      RESEARCH_RU_PROXY: ""
      RESEARCH_EU_PROXY: ${RESEARCH_EU_PROXY:-socks5://egress-xray:1080}
      RESEARCH_EXPECTED_COUNTRIES: ${RESEARCH_EXPECTED_COUNTRIES:-RU=RU,EU=SE}
      RESEARCH_SEARXNG_URL: http://searxng:8080
      RESEARCH_EXTRACTION_URL: http://research-worker:8770
      RESEARCH_BROWSER_URL: http://research-worker:8770
      RESEARCH_NATIVE_CONNECTORS: "1"
      RESEARCH_WORKER_TOKEN: ${RESEARCH_WORKER_TOKEN:?Set RESEARCH_WORKER_TOKEN}
      RESEARCH_API_TOKENS: ${RESEARCH_API_TOKENS:?Set RESEARCH_API_TOKENS}
      RESEARCH_OAUTH_ENABLED: ${RESEARCH_OAUTH_ENABLED:-1}
    volumes:
      - ./data/api:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    restart: unless-stopped

  browser-cdp:
    build: ./chrome
    networks:
      egress: {}
      search-net:
        aliases: [research-worker]
      marketplace-outbound: {}
    volumes:
      - ./data/chrome-profile:/profile
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "3", http://127.0.0.1:9222/json/version]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 1g
    mem_limit: 2g
    restart: unless-stopped

  research-worker:
    build:
      context: ../..
      target: worker
    network_mode: service:browser-cdp
    depends_on:
      browser-cdp:
        condition: service_healthy
        restart: true
    environment:
      RESEARCH_WORKER_HOST: 0.0.0.0
      RESEARCH_ALLOW_INTERNAL_HOSTS: "1"
      RESEARCH_CDP_URL: http://127.0.0.1:9222
      RESEARCH_CDP_MAX_CONCURRENT: "3"
      RESEARCH_RU_PROXY: ""
      RESEARCH_EU_PROXY: ${RESEARCH_EU_PROXY:-socks5://egress-xray:1080}
      RESEARCH_EXPECTED_COUNTRIES: ${RESEARCH_EXPECTED_COUNTRIES:-RU=RU,EU=SE}
      RESEARCH_WORKER_TOKEN: ${RESEARCH_WORKER_TOKEN:?Set RESEARCH_WORKER_TOKEN}
      RESEARCH_DATABASE: /data/research.sqlite3
      HOME: /root
    volumes:
      - ./data/worker:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    shm_size: 512m
    mem_limit: 2g
    restart: unless-stopped

  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    networks: [egress, search-net]
    volumes:
      - ./searxng.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET}
      FORCE_OWNERSHIP: "false"
    mem_limit: 512m
    restart: unless-stopped

networks:
  ingress:
    external: true
  egress:
    external: true
  search-net:
    driver: bridge
    internal: true
  marketplace-outbound:
    driver: bridge
