default_region: EU
domains:
  ru: RU
  ozon.ru: RU
  avito.ru: RU
  market.yandex.ru: RU
  4pda.to: RU
  forum.ixbt.com: RU
  reddit.com: EU
  github.com: EU
  api.github.com: EU
  x.com: EU
  news.ycombinator.com: EU
  hn.algolia.com: EU
# Adding a shop permits discovery, not bypass of its access policy.
marketplaces:
  ozon: ozon.ru
  avito: avito.ru
  yandex_market: market.yandex.ru
review_domains: [4pda.to, forum.ixbt.com, reddit.com, youtube.com]
enabled_marketplaces: [ozon, avito, yandex_market]
native_search_marketplaces: [avito, yandex_market]
# Anonymous browser checks are explicitly authorized. Content still follows robots.
# Protocol paths are used only to complete the site's own computational challenge.
automatic_challenges:
  avito.ru:
    backend: camoufox
    browser_version: 158.0.1-beta.41
    timeout: 75
    domains: [avito.ru, avito.st]
    protocol_paths: [/web/3/firewallPow/]
  ozon.ru:
    backend: camoufox
    browser_version: 158.0.1-beta.41
    timeout: 75
    domains: [ozon.ru, ozone.ru]
    protocol_paths: [/abt/result]
    asset_paths: [/s3/abt-challenge/, /s3/ozon-fonts/]
browser_timeout: 30
camoufox_python: /opt/research-ozon/bin/python
# Direct RU sockets run under the UID bypass in deploy/pi-egress.py.
ru_proxy: ""
eu_proxy: socks5://127.0.0.1:10808
verify_egress: true
expected_countries: {RU: RU, EU: LV}
max_bytes: 8000000
